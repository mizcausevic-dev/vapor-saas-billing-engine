name: ci

on:
  push:
    branches: [main, project/vapor-saas-billing-engine]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      # Build/test in release config: Swift 6.0.3 has a known debug-info
      # compiler crash on Darwin.POSIXErrorCode while compiling the transitive
      # async-http-client. The round-trip debug-types assertion only fires in
      # debug builds, so release config bypasses it.
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
